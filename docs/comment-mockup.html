<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup komentar — Rate PAP</title>
<style>
  :root { --cyan:#22d3ee; --line:rgba(148,163,184,.22); }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#070b14; color:#e2e8f0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { display:grid; grid-template-columns:minmax(0,420px) minmax(0,360px); gap:32px; padding:32px; align-items:start; justify-content:center; }
  @media (max-width:900px) { .wrap { grid-template-columns:minmax(0,420px); } }
  h1 { font-size:16px; margin:0 0 4px; }
  p.lead { margin:0 0 18px; font-size:12px; line-height:1.6; color:#94a3b8; }

  /* ---- phone ---- */
  .phone { position:relative; width:390px; height:844px; border-radius:34px; overflow:hidden;
    background:#0b1220; border:1px solid #1e293b; box-shadow:0 30px 80px rgba(0,0,0,.6); display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; }
  .score { display:flex; align-items:baseline; gap:6px; }
  .score b { color:#fbbf24; font-size:17px; }
  .score span { font-size:11px; color:#94a3b8; }
  .iconbtn { width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:rgba(30,41,59,.6); display:grid; place-items:center; color:#cbd5e1; font-size:13px; }
  .photobox { position:relative; flex:1; margin:0 10px; border-radius:22px; overflow:hidden; border:1px solid #1e293b; background:#020617; }
  .photobox img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .shade { position:absolute; inset:0; pointer-events:none; transition:background .25s; }
  .tapzone { position:absolute; inset:0; cursor:crosshair; }

  /* ---- pins ---- */
  .pin { position:absolute; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%;
    display:grid; place-items:center; font-size:11px; font-weight:800; color:#fff; cursor:pointer;
    border:2px solid #0b1220; background:linear-gradient(135deg,#0ea5e9,#2563eb);
    box-shadow:0 4px 14px rgba(2,6,23,.6); transition:transform .18s; }
  .pin:hover { transform:translate(-50%,-50%) scale(1.12); }
  .pin.cluster { background:linear-gradient(135deg,#f59e0b,#ea580c); }
  .pin .n { position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 4px; border-radius:9px;
    background:#22d3ee; color:#04222b; font-size:9px; font-weight:900; display:grid; place-items:center; border:1.5px solid #0b1220; }
  .pin .dot { width:6px; height:6px; border-radius:50%; background:#67e8f9; position:absolute; bottom:-9px; opacity:.9; }

  /* ---- bubbles ---- */
  .bubble { position:absolute; width:232px; transform:translateX(-50%); background:rgba(15,23,42,.97);
    border:1px solid rgba(34,211,238,.45); border-radius:14px; padding:10px 11px; box-shadow:0 16px 40px rgba(0,0,0,.55); }
  .bubble .who { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .bubble .av { width:18px; height:18px; border-radius:50%; background:linear-gradient(135deg,#0ea5e9,#2563eb); display:grid; place-items:center; font-size:9px; font-weight:800; }
  .bubble .name { font-size:10px; font-weight:700; color:#e2e8f0; }
  .bubble .time { font-size:9px; color:#64748b; margin-left:auto; }
  .bubble .txt { font-size:11.5px; line-height:1.5; color:#cbd5e1; }
  .bubble .foot { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:7px; border-top:1px solid rgba(148,163,184,.14); font-size:9.5px; color:#94a3b8; }
  .bubble .foot b { color:#22d3ee; }
  .bubble .tail { position:absolute; width:11px; height:11px; background:rgba(15,23,42,.97); border-right:1px solid rgba(34,211,238,.45); border-bottom:1px solid rgba(34,211,238,.45); transform:rotate(45deg); }
  .bubble.above .tail { bottom:-6px; left:50%; margin-left:-5px; }
  .bubble.below .tail { top:-6px; left:50%; margin-left:-5px; transform:rotate(225deg); }
  .counter { display:flex; align-items:center; gap:4px; }
  .dots { display:flex; gap:3px; }
  .dots i { width:4px; height:4px; border-radius:50%; background:#334155; }
  .dots i.on { background:#22d3ee; }

  /* ---- fan ---- */
  .fan { position:absolute; transform:translateX(-50%); }
  .fan .card { position:absolute; left:0; bottom:0; width:212px; background:rgba(15,23,42,.97);
    border:1px solid rgba(34,211,238,.35); border-radius:12px; padding:9px 10px; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .fan .card .txt { font-size:11px; line-height:1.45; color:#cbd5e1; }
  .fan .card .name { font-size:9px; font-weight:700; color:#7dd3fc; margin-bottom:3px; }

  /* ---- composer ---- */
  .composer { position:absolute; width:250px; transform:translateX(-50%); background:rgba(15,23,42,.98);
    border:1px solid rgba(34,211,238,.6); border-radius:14px; padding:8px; box-shadow:0 16px 40px rgba(0,0,0,.6); }
  .composer .row { display:flex; gap:6px; align-items:center; }
  .composer input { flex:1; background:transparent; border:0; outline:none; color:#e2e8f0; font-size:11.5px; padding:4px 2px; }
  .composer input::placeholder { color:#64748b; }
  .composer button { border:0; border-radius:9px; padding:6px 10px; font-size:10px; font-weight:800; color:#04222b; background:linear-gradient(135deg,#22d3ee,#0ea5e9); cursor:pointer; }
  .composer .hint { font-size:9px; color:#64748b; margin-top:4px; padding-left:2px; }

  /* ---- card footer ---- */
  .caption { margin:8px 10px 0; padding:8px 10px; border-radius:12px; background:rgba(30,41,59,.55); border:1px solid #1e293b; font-size:11px; text-align:center; color:#cbd5e1; }
  .nav { display:flex; gap:8px; padding:10px; }
  .nav div { flex:1; text-align:center; padding:9px 0; border-radius:12px; font-size:11px; font-weight:700; }
  .nav .prev { border:1px solid var(--line); color:#cbd5e1; background:rgba(30,41,59,.5); }
  .nav .next { background:linear-gradient(90deg,#06b6d4,#2563eb); color:#fff; }

  /* ---- panel ---- */
  .panel { border:1px solid #1e293b; border-radius:16px; padding:16px; background:rgba(15,23,42,.7); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tab { border:1px solid var(--line); background:transparent; color:#cbd5e1; font-size:11px; font-weight:700;
    padding:7px 10px; border-radius:10px; cursor:pointer; }
  .tab.on { background:#22d3ee; color:#04222b; border-color:#22d3ee; }
  .note h2 { font-size:13px; margin:0 0 6px; }
  .note p { font-size:11.5px; line-height:1.65; color:#94a3b8; margin:0 0 10px; }
  .note ul { margin:0 0 12px; padding-left:16px; font-size:11.5px; line-height:1.7; color:#94a3b8; }
  .note li b { color:#e2e8f0; }
  .stress { display:flex; align-items:center; gap:8px; font-size:11px; color:#94a3b8; margin-bottom:14px; }
  .stress button { border:1px solid var(--line); background:transparent; color:#cbd5e1; font-size:10.5px; padding:6px 10px; border-radius:9px; cursor:pointer; }
  .stress button.on { background:#f59e0b; border-color:#f59e0b; color:#1c1200; font-weight:800; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Mockup komentar di atas foto</h1>
    <p class="lead">Klik area foto untuk melihat composer. Klik pin untuk membuka komentar. Ganti varian di panel kanan.</p>
    <div class="phone">
      <div class="topbar">
        <div class="score"><b id="avg">8.1</b><span>/ 10.0</span></div>
        <div style="display:flex;gap:6px">
          <div class="iconbtn">&#128065;</div>
          <div class="iconbtn">&#8679;</div>
          <div class="iconbtn">i</div>
        </div>
      </div>
      <div class="photobox" id="photobox">
        <img src="../public/foto.jpg" alt="foto">
        <div class="shade" id="shade"></div>
        <div class="tapzone" id="tapzone"></div>
        <div id="pins"></div>
        <div id="overlays"></div>
      </div>
      <div class="caption">Foto pertama untuk di-rate &#128248;</div>
      <div class="nav"><div class="prev">Previous</div><div class="next">Next PAP</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab on" data-variant="pin">A &middot; Pin + bubble</button>
      <button class="tab" data-variant="fan">B &middot; Fan stack</button>
      <button class="tab" data-variant="play">C &middot; Auto-play</button>
    </div>
    <div class="stress">
      <button id="stressBtn">Uji padat: 24 komentar</button>
      <span id="clusterInfo"></span>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
var BASE = [
  { x:0.30, y:0.22, n:"Raka", i:"R", t:"Cahayanya bagus banget di sini", at:"2m" },
  { x:0.34, y:0.26, n:"Nadia", i:"N", t:"Setuju, golden hour-nya kena", at:"1m" },
  { x:0.31, y:0.18, n:"Bima", i:"B", t:"Angle-nya bikin fotonya hidup", at:"5m" },
  { x:0.68, y:0.55, n:"Sinta", i:"S", t:"Komposisinya rapi, suka", at:"8m" },
  { x:0.66, y:0.60, n:"Dimas", i:"D", t:"Background-nya agak rame", at:"9m" },
  { x:0.22, y:0.72, n:"Ayu", i:"A", t:"Pose-nya natural", at:"12m" },
  { x:0.74, y:0.32, n:"Tegar", i:"T", t:"Warnanya hangat, enak dilihat", at:"15m" }
];
var EXTRA = [
  { x:0.28, y:0.20, n:"Iqbal", i:"I", t:"Frame-nya pas", at:"16m" },
  { x:0.35, y:0.23, n:"Wulan", i:"W", t:"Crop-nya bisa lebih ketat", at:"18m" },
  { x:0.30, y:0.28, n:"Fajar", i:"F", t:"Edit warnanya mantap", at:"20m" },
  { x:0.69, y:0.58, n:"Sari", i:"S", t:"Subjeknya jelas", at:"21m" },
  { x:0.64, y:0.52, n:"Bayu", i:"B", t:"Shadow-nya lembut", at:"23m" },
  { x:0.72, y:0.62, n:"Rani", i:"R", t:"Agak overexposed dikit", at:"25m" },
  { x:0.20, y:0.70, n:"Yoga", i:"Y", t:"Momen-nya dapat", at:"27m" },
  { x:0.24, y:0.76, n:"Lia", i:"L", t:"Ekspresinya bagus", at:"30m" },
  { x:0.76, y:0.28, n:"Adi", i:"A", t:"Detailnya tajam", at:"33m" },
  { x:0.78, y:0.35, n:"Mira", i:"M", t:"Bokeh-nya halus", at:"35m" },
  { x:0.40, y:0.80, n:"Dewi", i:"D", t:"Suka komposisi diagonal", at:"38m" }
];

var state = { variant:"pin", active:-1, composer:null, playing:false, stress:false, timer:null, playIndex:0 };
var photo = document.getElementById("photobox");
var pinsEl = document.getElementById("pins");
var overlaysEl = document.getElementById("overlays");
var shadeEl = document.getElementById("shade");

function data() { return state.stress ? BASE.concat(EXTRA) : BASE; }

function clusters() {
  var items = data();
  var out = [];
  items.forEach(function (c) {
    for (var i = 0; i < out.length; i++) {
      var g = out[i];
      var dx = g.x - c.x, dy = (g.y - c.y) * 1.35;
      if (Math.sqrt(dx * dx + dy * dy) < 0.11) { g.items.push(c); g.x = (g.x * (g.items.length - 1) + c.x) / g.items.length; g.y = (g.y * (g.items.length - 1) + c.y) / g.items.length; return; }
    }
    out.push({ x:c.x, y:c.y, items:[c] });
  });
  return out;
}

function pxX(x) { return Math.round(x * photo.clientWidth); }
function pxY(y) { return Math.round(y * photo.clientHeight); }

function clampLeft(x) {
  var w = 232, half = w / 2 + 6;
  var cx = pxX(x);
  return Math.max(half, Math.min(photo.clientWidth - half, cx));
}

function render() {
  pinsEl.innerHTML = "";
  overlaysEl.innerHTML = "";
  shadeEl.style.background = "none";
  if (state.variant === "play") { renderPlay(); return; }

  var groups = clusters();
  var activeGroup = state.active >= 0 ? groups[state.active] : null;

  if (activeGroup) {
    var cx = pxX(activeGroup.x), cy = pxY(activeGroup.y);
    shadeEl.style.background = "radial-gradient(circle 190px at " + cx + "px " + cy + "px, rgba(2,6,23,0) 0%, rgba(2,6,23,.55) 62%, rgba(2,6,23,.72) 100%)";
  }

  groups.forEach(function (g, index) {
    var pin = document.createElement("div");
    pin.className = "pin" + (g.items.length > 1 ? " cluster" : "");
    pin.style.left = (g.x * 100) + "%";
    pin.style.top = (g.y * 100) + "%";
    pin.innerHTML = g.items[0].i + (g.items.length > 1 ? "<span class=\"n\">" + g.items.length + "</span>" : "<span class=\"dot\"></span>");
    pin.onclick = function (e) { e.stopPropagation(); state.active = index; state.composer = null; render(); };
    pinsEl.appendChild(pin);
  });

  if (activeGroup) renderBubble(activeGroup);
  if (state.composer) renderComposer();
}

function renderBubble(g) {
  var first = g.items[0];
  var x = clampLeft(g.x);
  var y = pxY(g.y);
  var above = g.y > 0.32;

  if (state.variant === "fan") {
    var fan = document.createElement("div");
    fan.className = "fan";
    fan.style.left = x + "px";
    fan.style.top = (above ? y - 10 : y + 44) + "px";
    fan.style.transform = above ? "translate(-50%,-100%)" : "translate(-50%,0)";
    var shown = g.items.slice(0, 3);
    shown.forEach(function (c, i) {
      var card = document.createElement("div");
      card.className = "card";
      var depth = shown.length - 1 - i;
      card.style.transform = "translate(" + (depth * 7) + "px," + (-depth * 9) + "px) rotate(" + (depth * -2.4) + "deg)";
      card.style.zIndex = String(i + 1);
      card.style.bottom = "0";
      card.innerHTML = "<div class=\"name\">" + c.n + "</div><div class=\"txt\">" + c.t + "</div>";
      fan.appendChild(card);
    });
    if (g.items.length > 3) {
      var more = document.createElement("div");
      more.className = "card";
      more.style.transform = "translate(" + (g.items.length > 3 ? 0 : 0) + "px,0)";
      more.style.zIndex = "0";
      more.style.opacity = ".7";
      more.style.textAlign = "center";
      more.innerHTML = "<div class=\"txt\">+" + (g.items.length - 3) + " komentar lain</div>";
      fan.appendChild(more);
    }
    overlaysEl.appendChild(fan);
    return;
  }

  var bubble = document.createElement("div");
  bubble.className = "bubble " + (above ? "above" : "below");
  bubble.style.left = x + "px";
  bubble.style.top = above ? (y - 26) + "px" : (y + 26) + "px";
  bubble.style.transform = above ? "translate(-50%,-100%)" : "translate(-50%,0)";

  var dots = "";
  for (var i = 0; i < Math.min(g.items.length, 5); i++) dots += "<i class=\"" + (i === 0 ? "on" : "") + "\"></i>";

  bubble.innerHTML =
    "<div class=\"who\"><span class=\"av\">" + first.i + "</span><span class=\"name\">" + first.n + "</span><span class=\"time\">" + first.at + "</span></div>" +
    "<div class=\"txt\">" + first.t + "</div>" +
    "<div class=\"foot\">" +
      (g.items.length > 1 ? "<b>" + g.items.length + " komentar</b><span>&middot;</span><span>geser untuk lihat</span>" : "<span>1 komentar</span>") +
      "<span style=\"margin-left:auto\" class=\"counter\"><span class=\"dots\">" + dots + "</span></span>" +
    "</div>" +
    "<div class=\"tail\"></div>";
  overlaysEl.appendChild(bubble);
}

function renderComposer() {
  var c = state.composer;
  var x = clampLeft(c.x);
  var y = pxY(c.y);
  var above = c.y > 0.32;
  var box = document.createElement("div");
  box.className = "composer";
  box.style.left = x + "px";
  box.style.top = above ? (y - 20) + "px" : (y + 20) + "px";
  box.style.transform = above ? "translate(-50%,-100%)" : "translate(-50%,0)";
  box.innerHTML =
    "<div class=\"row\"><input id=\"cinput\" placeholder=\"Tulis komentar di titik ini...\" autocomplete=\"off\"><button>Kirim</button></div>" +
    "<div class=\"hint\">Komentar menempel di titik ini, bukan di bawah foto.</div>";
  overlaysEl.appendChild(box);
  var input = document.getElementById("cinput");
  setTimeout(function () { input.focus(); }, 30);
  input.onkeydown = function (e) { if (e.key === "Enter") state.composer = null, render(); };
  box.querySelector("button").onclick = function () { state.composer = null; render(); };
}

function renderPlay() {
  var items = data();
  var c = items[state.playIndex % items.length];
  var x = clampLeft(c.x);
  var y = pxY(c.y);
  var above = c.y > 0.32;
  shadeEl.style.background = "radial-gradient(circle 190px at " + pxX(c.x) + "px " + pxY(c.y) + "px, rgba(2,6,23,0) 0%, rgba(2,6,23,.55) 62%, rgba(2,6,23,.72) 100%)";

  var pin = document.createElement("div");
  pin.className = "pin";
  pin.style.left = (c.x * 100) + "%";
  pin.style.top = (c.y * 100) + "%";
  pin.innerHTML = c.i + "<span class=\"dot\"></span>";
  pinsEl.appendChild(pin);

  var bubble = document.createElement("div");
  bubble.className = "bubble " + (above ? "above" : "below");
  bubble.style.left = x + "px";
  bubble.style.top = above ? (y - 26) + "px" : (y + 26) + "px";
  bubble.style.transform = above ? "translate(-50%,-100%)" : "translate(-50%,0)";
  bubble.innerHTML =
    "<div class=\"who\"><span class=\"av\">" + c.i + "</span><span class=\"name\">" + c.n + "</span><span class=\"time\">" + c.at + "</span></div>" +
    "<div class=\"txt\">" + c.t + "</div>" +
    "<div class=\"foot\"><span>Putar otomatis</span><b style=\"margin-left:auto\">" + ((state.playIndex % items.length) + 1) + "/" + items.length + "</b></div>" +
    "<div class=\"tail\"></div>";
  overlaysEl.appendChild(bubble);
}

function setVariant(v) {
  state.variant = v;
  state.active = -1;
  state.composer = null;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b.dataset.variant === v); });
  if (v === "play") {
    state.playIndex = 0;
    render();
    state.timer = setInterval(function () { state.playIndex++; render(); }, 2200);
  } else {
    render();
  }
  updateNote();
}

var NOTES = {
  pin: "<h2>A &middot; Pin + satu bubble</h2><p>Satu pin per titik. Pin yang berdekatan digabung jadi satu pin oranye dengan angka. Hanya satu thread terbuka, jadi mustahil tumpang tindih.</p><ul><li><b>Kuat:</b> tetap terbaca walau 50 komentar, dan pin bisa diklik tanpa salah sasaran.</li><li><b>Lemah:</b> terasa seperti anotasi peta kalau pin terlalu banyak.</li><li><b>Detail:</b> spotlight meredupkan sekeliling pin aktif; bubble flip ke bawah kalau pin di area atas.</li></ul>",
  fan: "<h2>B &middot; Fan stack</h2><p>Pin dengan banyak komentar membuka tumpukan kartu miring. Yang teratas terbaca, sisanya mengintip.</p><ul><li><b>Kuat:</b> langsung terasa ada percakapan, bukan sekadar angka.</li><li><b>Lemah:</b> maksimal 3 kartu terbaca; lebih dari itu tetap butuh daftar.</li><li><b>Detail:</b> kedalaman kartu dipakai sebagai isyarat jumlah, bukan warna.</li></ul>",
  play: "<h2>C &middot; Auto-play</h2><p>Komentar diputar otomatis satu per satu, bubble melompat mengikuti titiknya, dengan counter posisi.</p><ul><li><b>Kuat:</b> paling hidup untuk menikmati komentar orang lain, seperti story.</li><li><b>Lemah:</b> buruk untuk membaca panjang dan tidak bisa dipakai sambil menulis.</li><li><b>Detail:</b> cocok sebagai mode tambahan (tombol play), bukan pengganti tampilan utama.</li></ul>"
};

function updateNote() {
  var g = clusters();
  var biggest = g.reduce(function (m, x) { return x.items.length > m ? x.items.length : m; }, 0);
  document.getElementById("clusterInfo").textContent = data().length + " komentar / " + g.length + " pin, terbesar " + biggest;
  document.getElementById("note").innerHTML = NOTES[state.variant];
}

document.getElementById("tapzone").onclick = function (e) {
  if (state.variant === "play") return;
  var r = photo.getBoundingClientRect();
  state.active = -1;
  state.composer = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  render();
};

document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () { setVariant(b.dataset.variant); };
});

document.getElementById("stressBtn").onclick = function () {
  state.stress = !state.stress;
  this.classList.toggle("on", state.stress);
  this.textContent = state.stress ? "Kembali ke 7 komentar" : "Uji padat: 24 komentar";
  state.active = -1;
  render();
  updateNote();
};

window.addEventListener("resize", function () { render(); });

function openBiggest() {
  var groups = clusters();
  var best = 0;
  groups.forEach(function (g, i) { if (g.items.length > groups[best].items.length) best = i; });
  state.active = best;
  render();
}

setTimeout(openBiggest, 400);
setVariant(new URLSearchParams(location.search).get("variant") || "pin");
</script>
</body>
</html>
